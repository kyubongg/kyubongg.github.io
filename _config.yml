# ── 사이트 기본 정보 ─────────────────────────────────────────
title: "유규봉 기술 블로그"          # TODO: 원하는 블로그 이름으로 수정하세요
email: kyubongbong@gmail.com
description: >-
  개발자 유규봉의 프로젝트 분석과 기술 기록. LLM, 백엔드, 자동화 프로젝트를 중심으로 씁니다.
baseurl: ""                          # 저장소가 <username>.github.io 라면 빈 문자열 유지
url: "https://kyubongbong.github.io"  # TODO: 본인 GitHub Pages 주소로 수정하세요
github_username: kyubongbong          # TODO: 본인 GitHub 아이디로 수정하세요

# ── 테마 ────────────────────────────────────────────────────
theme: minima
minima:
  skin: dark                         # auto | classic | dark | solarized-dark 중 선택 가능
  social_links:
    - { platform: github, user_url: "https://github.com/kyubongbong" }

# ── 빌드 설정 ───────────────────────────────────────────────
markdown: kramdown
highlighter: rouge
permalink: /posts/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# ── 상단 메뉴 ───────────────────────────────────────────────
header_pages:
  - about.md

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
